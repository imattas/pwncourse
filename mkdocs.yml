site_name: PwnCourse
site_description: Zero-to-master binary exploitation with local WSL labs
site_url: https://your-user.github.io/pwncourse/
repo_name: pwncourse
docs_dir: mkdocs/docs
site_dir: dist
theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: lime
      toggle:
        icon: material/weather-night
        name: Use light mode
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
nav:
  - Home: index.md
  - Start here:
      - WSL setup: course/SETUP-WSL.md
      - Course map: course/COURSE.md
      - Lab index: course/LAB-INDEX.md
      - Remote localhost mode: course/REMOTE-TARGETS.md
  - Foundations:
      - Lesson: course/modules/00-foundations/README.md
      - ELF inspection: course/labs/00-foundations/hello-elf/README.md
      - Process memory: course/labs/00-foundations/argv-memory/README.md
      - ABI registers: course/labs/00-foundations/abi-registers/README.md
  - Stack Control:
      - Debugging: course/modules/01-debugging/README.md
      - Stack control: course/modules/02-stack-control/README.md
      - Crash course: course/labs/01-debugging/crash-course/README.md
      - Find the offset: course/labs/01-debugging/find-the-offset/README.md
      - ret2win: course/labs/02-stack/ret2win/README.md
      - ret2arg: course/labs/02-stack/ret2arg/README.md
      - Staged input: course/labs/02-stack/split-input/README.md
  - Advanced primitives:
      - Mitigations: course/modules/03-mitigations/README.md
      - Leaks and libc: course/modules/04-leaks-and-libc/README.md
      - ROP: course/modules/05-rop/README.md
      - Format strings: course/modules/06-format-strings/README.md
      - Heap: course/modules/07-heap/README.md
      - Advanced Linux: course/modules/08-advanced-linux/README.md
      - Kernel intro: course/modules/09-kernel-intro/README.md
      - GOT leak: course/labs/04-libc/got-leak/README.md
      - ROP call: course/labs/05-rop/rop-call/README.md
      - Format read: course/labs/06-format-string/fmt-read/README.md
      - Format write: course/labs/06-format-string/fmt-write/README.md
  - Heap labs:
      - Chunk inspection: course/labs/07-heap/chunk-inspect/README.md
      - Tcache reuse: course/labs/07-heap/tcache-reuse/README.md
      - UAF: course/labs/07-heap/uaf/README.md
      - Menu UAF: course/labs/07-heap/menu-uaf/README.md
      - Heap leak chain: course/labs/07-heap/heap-leak-chain/README.md
  - Capstones:
      - Chain engineering: course/modules/10-chain-engineering/README.md
      - Capstone guide: course/modules/10-capstone/README.md
      - Rubric: course/capstones/RUBRIC.md
  - Reference:
      - GDB: course/reference/gdb.md
      - pwntools: course/reference/pwntools.md
      - Mitigation matrix: course/reference/mitigation-matrix.md
