site_name: PwnCourse
site_description: Zero-to-master binary exploitation with local WSL labs
site_url: https://pwncourse.zemi.gg/
repo_name: pwncourse
docs_dir: mkdocs/docs
site_dir: dist
theme:
  name: readthedocs
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
nav:
  - Home: index.md
  - WSL setup: course/SETUP-WSL.md
  - Lessons:
      - 1. ELF, memory, and ABI: course/lessons/01-foundations.md
      - 2. GDB and crash triage: course/lessons/02-debugging.md
      - 3. Stack control and ret2win: course/lessons/03-stack-control.md
      - 4. Pwntools exploit development: course/lessons/04-pwntools.md
      - 5. Mitigations and information leaks: course/lessons/05-mitigations.md
      - 6. Format-string exploitation: course/lessons/06-format-strings.md
      - 7. ROP chain engineering: course/lessons/07-rop.md
      - 8. ret2libc and remote reliability: course/lessons/08-ret2libc.md
      - 9. Localhost socket services: course/lessons/09-remote-services.md
      - 10. Heap fundamentals and UAF: course/lessons/10-heap.md
      - 11. Advanced heap exploitation: course/lessons/11-advanced-heap.md
      - 12. Sandboxes and custom capstones: course/lessons/12-capstone.md
