site_name: PwnCourse
site_description: Zero-to-master binary exploitation with local WSL labs
site_url: https://imattas.github.io/pwncourse/
repo_name: pwncourse
docs_dir: mkdocs/docs
site_dir: dist
theme:
  name: mkdocs
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - tables
nav:
  - Home: index.md
  - Start here:
      - WSL setup: course/SETUP-WSL.md
      - Course map: course/COURSE.md
      - Lab index: course/LAB-INDEX.md
      - Remote localhost mode: course/REMOTE-TARGETS.md
  - Course chapters:
      - 1. Foundations and debugging: course/chapters/01-foundations.md
      - 2. Stack overflows: course/chapters/02-stack-overflows.md
      - 3. Mitigations and leaks: course/chapters/03-mitigations-and-leaks.md
      - 4. ROP and ret2libc: course/chapters/04-rop-and-ret2libc.md
      - 5. Format strings: course/chapters/05-format-strings.md
      - 6. Heap exploitation: course/chapters/06-heap-exploitation.md
      - 7. Advanced chains and capstones: course/chapters/07-advanced-chains.md
  - Labs and downloads: course/LAB-INDEX.md
  - References:
      - GDB field guide: course/reference/gdb.md
      - pwntools field guide: course/reference/pwntools.md
      - Mitigation matrix: course/reference/mitigation-matrix.md
      - WSL setup: course/SETUP-WSL.md
      - Local remote mode: course/REMOTE-TARGETS.md
  - Reference:
      - GDB: course/reference/gdb.md
      - pwntools: course/reference/pwntools.md
      - Mitigation matrix: course/reference/mitigation-matrix.md
